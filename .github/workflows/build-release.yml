name: Build and Release APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build
      
    - name: Run unit tests
      run: ./gradlew test
      
    - name: Build Release APK
      run: ./gradlew assembleRelease
      
    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyguard-release-apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
        
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: keyguard-release-apk
        
    - name: Get version name
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F '"' '{print $2}')
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version_name }}
        name: KeyGuard v${{ steps.version.outputs.version_name }}
        body: |
          ## KeyGuard Privacy Keyboard v${{ steps.version.outputs.version_name }}
          
          ### Features
          - Privacy-first keyboard with no telemetry
          - No internet access required
          - Customizable themes (Light/Dark/System)
          - Word suggestions and autocorrect
          - Smooth animations and haptic feedback
          - Material Design interface
          
          ### What's New
          - Initial release
          
          ### Installation
          1. Download the APK
          2. Enable "Install from Unknown Sources" in Android settings
          3. Open the APK and install
          4. Go to Settings → System → Languages & input → Virtual keyboard
          5. Enable KeyGuard and set as default
          
          **Supported Android versions:** Android 8.0 (API 26) and above
        files: app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
